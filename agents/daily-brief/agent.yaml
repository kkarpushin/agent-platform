name: daily-brief
title: Сводка руководителя
version: 0.2.0
owner: anna
description: Показывает задачи, препятствия и вопросы людям по общему состоянию.
input:
  type: object
  additionalProperties: false
  required:
  - project_id
  properties:
    project_id:
      type: string
      title: Проект
      enum:
      - all
      - P01
      - P02
      default: all
output:
  type: object
  additionalProperties: false
  required:
  - markdown
  - source_refs
  - questions
  properties:
    markdown:
      type: string
      minLength: 1
      maxLength: 20000
    source_refs:
      type: array
      minItems: 1
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        maxLength: 80
    questions:
      type: array
      maxItems: 20
      items:
        type: string
        maxLength: 1000
context:
- projects
- rules
- finance
roles:
- ceo
- sales
- delivery
skills:
- daily-brief
workspace: true
