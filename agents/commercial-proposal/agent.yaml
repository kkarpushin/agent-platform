{
  "name": "commercial-proposal",
  "version": "0.1.0",
  "owner": "anna",
  "description": "Подбор услуг, точный расчёт по прайсу и черновик предложения для проверки человеком.",
  "context": [
    "services",
    "costs",
    "cases",
    "clients",
    "templates"
  ],
  "roles": [
    "ceo",
    "sales"
  ],
  "input": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "client": {
        "type": "string",
        "title": "Клиент",
        "description": "Имя из базы знаний, например Орбита",
        "minLength": 1,
        "maxLength": 100,
        "default": "Орбита"
      },
      "task": {
        "type": "string",
        "title": "Задача",
        "description": "Что нужно клиенту",
        "minLength": 5,
        "maxLength": 3000,
        "default": "Нужен аудит процесса обработки заявок"
      },
      "budget": {
        "type": "number",
        "title": "Бюджет, USD",
        "description": "Необязательно; это ограничение клиента, а не цена",
        "minimum": 0,
        "maximum": 10000000,
        "default": 2400
      },
      "deadline": {
        "type": "string",
        "title": "Желаемый срок",
        "minLength": 2,
        "maxLength": 200,
        "default": "В течение двух недель"
      },
      "language": {
        "type": "string",
        "title": "Язык",
        "enum": [
          "ru"
        ],
        "default": "ru"
      }
    },
    "required": [
      "client",
      "task",
      "deadline",
      "language"
    ]
  },
  "output": {
    "type": "object",
    "additionalProperties": false,
    "properties": {
      "markdown": {
        "type": "string",
        "maxLength": 50000
      },
      "services": {
        "type": "array",
        "minItems": 1,
        "maxItems": 6,
        "items": {
          "type": "object",
          "additionalProperties": false,
          "properties": {
            "service_id": {
              "type": "string"
            },
            "name": {
              "type": "string"
            },
            "price_usd": {
              "type": "number",
              "minimum": 0
            },
            "days": {
              "type": "integer",
              "minimum": 1
            }
          },
          "required": [
            "service_id",
            "name",
            "price_usd",
            "days"
          ]
        }
      },
      "total_price": {
        "type": "number",
        "minimum": 0
      },
      "timeline": {
        "type": "integer",
        "minimum": 1
      },
      "cases": {
        "type": "array",
        "items": {
          "type": "string"
        }
      },
      "assumptions": {
        "type": "array",
        "items": {
          "type": "string"
        }
      }
    },
    "required": [
      "markdown",
      "services",
      "total_price",
      "timeline",
      "cases",
      "assumptions"
    ]
  },
  "skills": [
    "proposal"
  ]
}
