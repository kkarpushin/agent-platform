purpose: Из сообщений и встреч получать проверенные задачи, решения людей и контроль
  исполнения.
company: Студия «Маяк» — вымышленная команда из пяти ответственных.
owner: anna
success_criteria:
- Сообщение связано с задачей, вопросом или обоснованным отсутствием действия.
- По каждому предложению видны источники и точные версии.
- Доска меняется только после решения Анны.
- Повтор сообщения не создаёт вторую задачу.
- Продолжение обновляет ту же задачу с сохранением истории.
