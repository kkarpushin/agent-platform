purpose: Каждая заявка получает обоснованное предложение с проверенной ценой и решением ответственного человека.
company: Студия «Маяк» — вымышленная команда внедрения AI-систем, около 90 человек.
owner: anna
success_criteria:
  - Цена рассчитана программой по доступному прайсу; бюджет клиента не меняет цену.
  - Для использованных сведений сохранены источник и его точная версия.
  - Человек утверждает конкретную версию; после правок нужно новое решение.
  - Повтор одного запроса не создаёт второй результат.
  - Ошибки видны, несделанное не названо выполненным.
