ceo:
  title: Руководитель
  description: Отвечает за результат, управляет знаниями и утверждает предложения.
  sections: [services, costs, cases, clients, templates, technical]
  can_approve: true
sales:
  title: Продажи
  description: Готовит справки и предложения; видит цены, но не себестоимость.
  sections: [services, cases, clients, templates]
  can_approve: false
delivery:
  title: Исполнение
  description: Изучает клиентов, кейсы и технические условия; не запускает расчёт предложения.
  sections: [cases, clients, technical]
  can_approve: false
finance:
  title: Финансы
  description: Проверяет цены и себестоимость; не утверждает коммерческие обещания.
  sections: [services, costs]
  can_approve: false
