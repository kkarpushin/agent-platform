ceo:
  title: Руководитель
  description: Видит все сведения и утверждает точные изменения задач.
  sections:
  - projects
  - rules
  - finance
  can_approve: true
sales:
  title: Координатор проектов
  description: Разбирает сообщения, предлагает задачи и читает сводку; не видит внутренние
    финансовые сведения.
  sections:
  - projects
  - rules
  can_approve: false
delivery:
  title: Исполнение
  description: Читает проекты и задачи, запускает сводку; не меняет обязательства
    команды.
  sections:
  - projects
  - rules
  can_approve: false
finance:
  title: Финансы
  description: Читает внутренние финансовые сведения; не разбирает сообщения проектов.
  sections:
  - finance
  can_approve: false
